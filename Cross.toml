[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y libasound2-dev pkg-config"
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64 || true",
    "apt-get update && apt-get install -y libasound2-dev:arm64 pkg-config"
]

[target.x86_64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install -y wget build-essential pkg-config",
    "wget https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.9.tar.bz2",
    "tar -xjf alsa-lib-1.2.9.tar.bz2",
    "cd alsa-lib-1.2.9 && ./configure --enable-static --disable-shared --host=x86_64-linux-musl CC=x86_64-linux-musl-gcc --prefix=/usr && make -j$(nproc) && make install",
    "rm -rf alsa-lib-1.2.9*"
]
[target.x86_64-unknown-linux-musl.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/pkgconfig",
    "RUSTFLAGS = -L /usr/lib -l static=asound",
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install -y wget build-essential pkg-config",
    "wget https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.9.tar.bz2",
    "tar -xjf alsa-lib-1.2.9.tar.bz2",
    "cd alsa-lib-1.2.9 && ./configure --enable-static --disable-shared --host=aarch64-linux-musl CC=aarch64-linux-musl-gcc --prefix=/usr && make -j$(nproc) && make install",
    "rm -rf alsa-lib-1.2.9*"
]
[target.aarch64-unknown-linux-musl.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH=/usr/lib/pkgconfig",
    "RUSTFLAGS = -L /usr/lib -l static=asound",
]